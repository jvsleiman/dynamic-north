name: Analisar APK base

# Baixa o .apks do Drive (link aberto), descompila e publica o resultado no branch `analise`.
# Só rode com o repositório PRIVADO: o resultado contém código do app original.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-nzugwz]
    paths: [.github/workflows/analise.yml, ANALISAR]

permissions:
  contents: write

env:
  DRIVE_ID: 1YpUqFvPk4W-x2cN-2z1ehmWhd89DifF2
  JADX: "1.5.1"
  APKTOOL: "2.10.0"

jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recusar repositório público
        run: |
          vis=$(curl -fsS -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}" | jq -r .private)
          [ "$vis" = "true" ] || { echo "Repositório público: não vou publicar a análise."; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Baixar do Drive
        run: |
          mkdir -p work && cd work
          curl -fL -o base.apks "https://drive.usercontent.google.com/download?id=$DRIVE_ID&export=download&confirm=t"
          ls -la base.apks
          file base.apks
          unzip -o -q base.apks -d apks
          ls -la apks

      - name: Ferramentas
        run: |
          cd work
          curl -fsSL -o jadx.zip "https://github.com/skylot/jadx/releases/download/v$JADX/jadx-$JADX.zip"
          unzip -q jadx.zip -d jadx
          curl -fsSL -o apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v$APKTOOL/apktool_$APKTOOL.jar"

      - name: Descompilar
        run: |
          cd work
          BASE=$(ls apks/*.apk | grep -iE 'base' | head -1); BASE=${BASE:-$(ls -S apks/*.apk | head -1)}
          echo "base: $BASE"
          java -jar apktool.jar d -f -s -o res "$BASE" >/dev/null
          ./jadx/bin/jadx --no-res -d src "$BASE" || true
          mkdir -p ../out
          cp res/AndroidManifest.xml ../out/
          cp -r res/res ../out/res
          # Só o código do próprio app (as bibliotecas ficam de fora).
          PKG=$(grep -o 'package="[^"]*"' res/AndroidManifest.xml | head -1 | cut -d'"' -f2)
          echo "$PKG" > ../out/PACOTE.txt
          ls src/sources > ../out/pacotes-raiz.txt
          (cd src/sources && find . -name '*.java' | sed 's#^\./##' | sort) > ../out/classes.txt
          mkdir -p ../out/src
          (cd src/sources && find . -type d -maxdepth 3 | sort) > ../out/arvore.txt
          P=$(echo "$PKG" | tr . /)
          [ -d "src/sources/$P" ] && cp -r "src/sources/$P" ../out/src/ || true
          ls apks > ../out/splits.txt
          du -sh ../out; find ../out -type f | wc -l

      - name: Publicar no branch analise
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan analise
          git rm -rf -q --cached .
          git add -f out/
          git commit -q -m "Análise do APK base (build ${GITHUB_RUN_NUMBER})"
          git push -f origin analise
