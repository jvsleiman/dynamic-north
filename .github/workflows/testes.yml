name: Bateria de testes

on:
  push:
    branches: [claude/project-thread-nzugwz]
    paths: ['testes/**', '.github/workflows/testes.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar versão de testes
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rodar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash testes/rodar.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado
          path: resultado/
      - name: Publicar resultado no branch testes
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan testes
          git rm -rf -q --cached .
          git add -f resultado/
          git commit -q -m "Testes de ${GITHUB_SHA::7}"
          git push -f origin testes
